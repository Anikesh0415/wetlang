name: WetLang CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest pytest-cov

      - name: Compile Native C99 Runtime
        run: |
          python native/build.py

      - name: Run Test Suite
        run: |
          pytest tests -v

      - name: Smoke Test Examples and Benchmarks
        run: |
          python demo.py
          python -m wetlang.cli check examples/01_single_organoid_baseline.wet --format=json
          python examples/05_gymnasium_active_inference.py
          python examples/06_snntorch_validation.py
          python benchmarks/finalspark_validation.py

  vscode-extension:
    name: VS Code Extension TypeCheck (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and TypeCheck Extension
        working-directory: vscode-wetlang
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
